components:
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: A human-readable error message.
    Unauthorized:
      description: Authentication is required or the provided credentials are invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: A human-readable error message.
    BadRequest:
      description: The request was malformed or missing required parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: A human-readable error message.
              details:
                type: object
                description: Additional details about the validation error.
  schemas:
    Review:
      type: object
      description: A code review in Helix Swarm, representing a set of changes under review with participants, votes, and state.
      properties:
        id:
          type: integer
          description: The unique review identifier.
          example: abc123
        author:
          type: string
          description: The username of the review author.
          example: example_value
        changes:
          type: array
          items:
            type: integer
          description: List of changelist IDs associated with the review.
          example: []
        commits:
          type: array
          items:
            type: integer
          description: List of committed changelist IDs.
          example: []
        commitStatus:
          type: array
          items:
            type: object
          description: Status of commit operations.
          example: []
        created:
          type: integer
          description: Unix timestamp when the review was created.
          example: 10
        deployDetails:
          type: array
          items:
            type: object
          description: Deploy configuration details.
          example: []
        deployStatus:
          type: string
          description: The current deploy status.
          example: example_value
        description:
          type: string
          description: The review description.
          example: A sample description.
        groups:
          type: array
          items:
            type: object
          description: Reviewer groups assigned to the review.
          example: []
        participants:
          type: object
          additionalProperties:
            type: object
          description: Map of participant usernames to their participation details including votes and required status.
          example: example_value
        pending:
          type: boolean
          description: Whether the review has a pending changelist.
          example: true
        projects:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Map of project IDs to affected branch names.
          example: example_value
        roles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Map of roles to lists of usernames.
          example: example_value
        state:
          type: string
          enum:
          - needsReview
          - needsRevision
          - approved
          - archived
          - rejected
          description: The current state of the review.
          example: needsReview
        stateLabel:
          type: string
          description: A display-friendly label for the current state.
          example: example_value
        testDetails:
          type: array
          items:
            type: object
          description: Details of test runs.
          example: []
        testStatus:
          type: string
          description: The overall test status.
          example: example_value
        type:
          type: string
          description: The review type (default or personal).
          example: example_value
        updated:
          type: integer
          description: Unix timestamp when the review was last updated.
          example: 10
        updateDate:
          type: string
          format: date-time
          description: ISO 8601 formatted date when the review was last updated.
          example: '2026-01-15T10:30:00Z'
        versions:
          type: array
          items:
            type: object
            properties:
              difference:
                type: integer
              stream:
                type: string
              change:
                type: integer
              user:
                type: string
              time:
                type: integer
              pending:
                type: boolean
              archiveChange:
                type: integer
          description: List of review version objects.
          example: []
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Perforce username and password or ticket. The password can be a standard Perforce password or a Swarm-generated API ticket.
externalDocs:
  description: Helix Swarm API Documentation
  url: https://help.perforce.com/helix-core/helix-swarm/swarm/current/Content/Swarm/swarm-apidoc_endpoints.html
